<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — NexusGaming</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">N</span> NexusGaming</a>
    <div class="header-actions"></div>
  </div>
</header>

<main class="container" style="padding-top:32px">
  <h1>Complete Your Order</h1>
  <div id="paymentChat" class="form-card" style="margin:32px 0;max-width:760px">
    <div id="msg"></div>
    <div id="orderSummary" class="empty" style="padding:16px 0">Loading your order...</div>
    <div id="messages" style="max-height:360px;overflow:auto;margin:16px 0"></div>
    <div id="paymentOptions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button type="button" class="btn btn-outline btn-sm" data-payment-reply="Show me the available payment methods">Payment methods</button>
      <button type="button" class="btn btn-outline btn-sm" data-payment-reply="I have made the payment. I will send the payment details.">I have paid</button>
      <button type="button" class="btn btn-outline btn-sm" data-payment-reply="Please help me complete this order.">Need help</button>
    </div>
    <form id="paymentForm">
      <div class="form-group">
        <label for="paymentMessage">Message for the admin</label>
        <textarea id="paymentMessage" rows="4" required placeholder="Ask how to pay or send a question about this order..."></textarea>
      </div>
      <button id="sendPaymentMessage" class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Send to Admin</button>
    </form>
  </div>
</main>

<script src="/js/main.js"></script>
<script>
const orderId = new URLSearchParams(location.search).get('orderId');

async function loadCheckoutChat() {
  if (!orderId) {
    document.getElementById('orderSummary').innerHTML = '<h3>Order not found</h3><p><a href="/cart.html">Return to cart</a></p>';
    return;
  }
  try {
    const [order, messages] = await Promise.all([
      api(`/api/orders/${orderId}`),
      api('/api/messages'),
    ]);
    document.getElementById('orderSummary').innerHTML = `
      <div style="text-align:left">
        <h3>${escapeHTML(order.orderNumber)}</h3>
        <div style="margin:12px 0;color:var(--text-dim)">
          ${order.items.map(i => `${i.quantity}× ${escapeHTML(i.product.name)} — ${formatMoney(Number(i.unitPrice) * i.quantity)}`).join('<br>')}
        </div>
        <strong style="font-size:20px">Amount: ${formatMoney(order.total)}</strong>
        <p style="margin-top:10px">Chat with the admin to receive an approved payment method.</p>
      </div>
    `;
    renderMessages(messages.filter(m => m.orderId === orderId));
  } catch (e) {
    document.getElementById('orderSummary').innerHTML = `<div class="form-msg error">${escapeHTML(e.message)}</div>`;
  }
}

function renderMessages(messages) {
  const container = document.getElementById('messages');
  container.innerHTML = messages.length ? messages.map(m => `
    <div style="padding:10px 12px;margin-bottom:8px;border-radius:10px;${m.sender.role.name === 'ADMIN' ? 'background:var(--primary);margin-right:20%' : 'background:var(--surface-2);margin-left:20%'}">
      ${escapeHTML(m.body)}
      <div style="font-size:11px;opacity:.75;margin-top:4px">${new Date(m.createdAt).toLocaleString()}</div>
    </div>
  `).join('') : '<p style="color:var(--text-dim)">Waiting for an admin to send payment instructions...</p>';
  container.scrollTop = container.scrollHeight;
}

document.getElementById('paymentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('paymentMessage');
  const button = document.getElementById('sendPaymentMessage');
  button.disabled = true;
  button.textContent = 'Sending...';
  try {
    await api('/api/messages', {
      method: 'POST',
      body: { orderId, body: input.value },
    });

    document.getElementById('paymentOptions').addEventListener('click', (e) => {
      const option = e.target.closest('[data-payment-reply]');
      if (!option) return;
      document.getElementById('paymentMessage').value = option.dataset.paymentReply;
      document.getElementById('paymentMessage').focus();
    });
    input.value = '';
    button.textContent = 'Sent';
    const messages = await api('/api/messages');
    renderMessages(messages.filter(m => m.orderId === orderId));
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    button.disabled = false;
    button.textContent = 'Send to Admin';
  }
});

loadCheckoutChat();
</script>
</body>
</html>

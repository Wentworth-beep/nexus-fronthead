<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — NexusGaming</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">N</span> NexusGaming</a>
    <form class="search-bar" id="searchForm"><input placeholder="Search..." /><button>Search</button></form>
    <nav class="nav-links"><a href="/products.html">Shop</a></nav>
    <div class="header-actions"></div>
  </div>
</header>

<main class="container" style="padding-top:32px">
  <h1 style="margin-bottom:24px">Shopping Cart</h1>
  <div class="cart-layout" id="cartLayout"></div>
</main>

<script src="/js/main.js?=v2"></script>
<script>
let currentCoupon = null;

async function load() {
  try {
    const { cart, subtotal } = await api('/api/cart');
    const layout = document.getElementById('cartLayout');
    if (cart.items.length === 0) {
      layout.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>Your cart is empty</h3><p><a href="/products.html">Start shopping →</a></p></div>`;
      return;
    }
    const discount = currentCoupon?.discount || 0;
    const total = Math.max(0, subtotal - discount);
    layout.innerHTML = `
      <div>
        ${cart.items.map(i => `
          <div class="cart-item">
            <div class="cart-item-thumb">🎮</div>
            <div class="cart-item-info">
              <div style="font-weight:600;margin-bottom:4px">${i.product.name}</div>
              <div style="color:var(--text-dim);font-size:13px">${formatMoney(i.product.price)} each</div>
            </div>
            <input class="qty-input" type="number" min="1" value="${i.quantity}" onchange="updateQty('${i.id}', this.value)" />
            <div style="font-weight:700;min-width:80px;text-align:right">${formatMoney(Number(i.product.price) * i.quantity)}</div>
            <button class="btn btn-outline btn-sm" onclick="removeItem('${i.id}')">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="summary">
        <h3 style="margin-bottom:16px">Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>${formatMoney(subtotal)}</span></div>
        ${discount ? `<div class="summary-row" style="color:var(--success)"><span>Discount</span><span>-${formatMoney(discount)}</span></div>` : ''}
        <div class="summary-row total"><span>Total</span><span>${formatMoney(total)}</span></div>
        <div class="form-group" style="margin-top:16px">
          <label>Coupon Code</label>
          <div style="display:flex;gap:8px">
            <input id="couponInput" placeholder="WELCOME10" value="${currentCoupon?.code || ''}" />
            <button class="btn btn-outline btn-sm" onclick="applyCoupon(${subtotal})">Apply</button>
          </div>
        </div>
        <button id="checkoutButton" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="checkout()">Checkout</button>
      </div>
    `;
  } catch (e) {
    if (e.message.includes('Not authenticated')) { location.href = '/login.html'; return; }
    document.getElementById('cartLayout').innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

async function updateQty(id, qty) {
  await api(`/api/cart/${id}`, { method: 'PUT', body: { quantity: Number(qty) } });
  load(); updateCartBadge();
}
async function removeItem(id) {
  await api(`/api/cart/${id}`, { method: 'DELETE' });
  load(); updateCartBadge();
}
async function applyCoupon(subtotal) {
  const code = document.getElementById('couponInput').value.trim();
  if (!code) return;
  try {
    const data = await api('/api/coupons/validate', { method: 'POST', body: { code, subtotal } });
    currentCoupon = { code, discount: data.discount };
    toast('Coupon applied!');
    load();
  } catch (e) { toast(e.message, 'error'); }
}
async function checkout() {
  const button = document.getElementById('checkoutButton');
  button.disabled = true;
  button.textContent = 'Processing order...';
  try {
    const order = await api('/api/orders', {
      method: 'POST',
      body: { couponCode: currentCoupon?.code || null },
    });
    button.textContent = 'Opening payment chat...';
    await api('/api/messages', {
      method: 'POST',
      body: {
        orderId: order.id,
        body: `I placed order ${order.orderNumber}. Please tell me the available payment methods for the $${Number(order.total).toFixed(2)} amount.`,
      },
    });
    location.href = `/checkout.html?orderId=${encodeURIComponent(order.id)}`;
  } catch (e) {
    toast(e.message, 'error');
    button.disabled = false;
    button.textContent = 'Checkout';
  }
}

load();
</script>
</body>
</html>

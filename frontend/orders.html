<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — NexusGaming</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">N</span> NexusGaming</a>
    <nav class="nav-links"><a href="/products.html">Shop</a><a href="/account.html">Account</a></nav>
    <div class="header-actions"></div>
  </div>
</header>
<main class="container" style="padding-top:32px" id="main"><div class="empty">Loading...</div></main>
<script src="/js/main.js?v=chat-v3"></script>
<script>
(async () => {
  try {
    const orders = await api('/api/orders');
    const main = document.getElementById('main');
    if (orders.length === 0) {
      main.innerHTML = `<h1>My Orders</h1><div class="empty"><h3>No orders yet</h3><p><a href="/products.html">Start shopping →</a></p></div>`;
      return;
    }
    main.innerHTML = `<h1>My Orders</h1>` + orders.map(o => `
      <div class="cart-item" style="flex-direction:column;align-items:stretch;margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div>
            <div style="font-weight:700">${o.orderNumber}</div>
            <div style="color:var(--text-dim);font-size:13px">${new Date(o.createdAt).toLocaleString()}</div>
          </div>
          <span class="badge-status ${o.status}">${o.status}</span>
        </div>
        <div style="font-size:14px;color:var(--text-dim)">
          ${o.items.map(i => `${i.quantity}× ${escapeHTML(i.product?.name || 'Item')}`).join(' · ')}
        </div>
        <div style="font-weight:800;margin-top:8px">Total: ${formatMoney(o.total)}</div>
        <button class="btn btn-outline" style="margin-top:12px" onclick="openOrderChat('${o.id}')">💬 Chat with Admin</button>
      </div>
    `).join('');
  } catch (e) {
    if (e.message.includes('Not authenticated')) { location.href = '/login.html'; return; }
    document.getElementById('main').innerHTML = `<div class="empty">${e.message}</div>`;
  }
})();

async function openOrderChat(orderId) {
  if (typeof openAdminChat === 'function') openAdminChat(orderId);
}

if (typeof setupMiniAdminChat === 'function') setupMiniAdminChat();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — NexusGaming</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo"><span class="logo-mark">N</span> NexusGaming</a>
    <form class="search-bar" id="searchForm">
      <input type="text" placeholder="Search products..." />
      <button type="submit">Search</button>
    </form>
    <nav class="nav-links">
      <a href="/products.html">Shop</a>
      <a href="/categories.html">Categories</a>
      <a href="/orders.html">Orders</a>
    </nav>
    <div class="header-actions"></div>
  </div>
</header>

<main class="container" style="padding-top:32px">
  <h1 style="margin-bottom:20px">All Products</h1>
  <div class="filters">
    <select id="filterCategory"><option value="">All Categories</option></select>
    <select id="filterPlatform"><option value="">All Platforms</option></select>
    <select id="filterSort">
      <option value="">Newest</option>
      <option value="price_asc">Price: Low → High</option>
      <option value="price_desc">Price: High → Low</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>
  <div class="product-grid" id="productGrid"></div>
</main>

<footer class="site-footer"><div class="footer-bottom"><span>© 2025 NexusGaming</span><span>Secure shopping</span></div></footer>

<!-- CRITICAL FIX: ?v=2 forces cache refresh -->
<script src="/js/main.js?v=2"></script>
<script src="/js/products.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Customers</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .admin-layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .admin-sidebar { background: var(--bg-2); padding: 24px; border-right: 1px solid var(--border); }
  .admin-sidebar a { display: block; padding: 10px 14px; border-radius: 8px; color: var(--text-dim); margin-bottom: 4px; font-size: 14px; }
  .admin-sidebar a.active { background: var(--surface); color: var(--text); }
  .admin-content { padding: 32px; }
</style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/" class="logo" style="margin-bottom:24px;display:flex"><span class="logo-mark">N</span> Admin</a>
    <a href="/admin/dashboard.html">📊 Dashboard</a>
    <a href="/admin/products.html">📦 Products</a>
    <a href="/admin/orders.html">🧾 Orders</a>
    <a href="/admin/customers.html" class="active">👥 Customers</a>
    <a href="/admin/messages.html">💬 Messages</a>
    <a href="/">← Back to Store</a>
  </aside>
  <main class="admin-content">
    <h1>Customers</h1>
    <div id="content" style="margin-top:20px"><div class="empty">Loading...</div></div>
  </main>
</div>
<script src="/js/main.js"></script>
<script>
(async () => {
  if (!(await requireAdminPage())) return;
  try {
    const users = await api('/api/admin/users');
    document.getElementById('content').innerHTML = `
      <table class="data-table">
        <thead><tr><th>Email</th><th>Role</th><th>Orders</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.email}</td>
              <td>${u.role}</td>
              <td>${u.orders}</td>
              <td>${u.isActive ? '✓ Active' : '✗ Disabled'}</td>
              <td>${new Date(u.createdAt).toLocaleDateString()}</td>
              ${u.role === 'CUSTOMER' ? `
                <td>
                  <button class="btn btn-outline btn-sm" onclick="banClient('${u.id}', ${u.isActive})">${u.isActive ? 'Ban' : 'Unban'}</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteClient('${u.id}')">Delete</button>
                </td>
              ` : '<td>—</td>'}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    toast('Admin customers loaded successfully');
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty">${e.message}</div>`;
    toast(e.message, 'error');
  }
})();

async function banClient(id, isActive) {
  if (!confirm(isActive ? 'Ban this client account?' : 'Unban this client account?')) return;
  try {
    await api(`/api/admin/users/${id}`, { method:'PATCH', body:{ isActive: !isActive } });
    toast(isActive ? 'Client account banned' : 'Client account restored');
    setTimeout(() => location.reload(), 300);
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function deleteClient(id) {
  if (!confirm('Permanently delete this client account and its data?')) return;
  try {
    await api(`/api/admin/users/${id}`, { method:'DELETE' });
    toast('Client account deleted');
    setTimeout(() => location.reload(), 300);
  } catch (err) {
    toast(err.message, 'error');
  }
}
</script>
</body>
</html>
